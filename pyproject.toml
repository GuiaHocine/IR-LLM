[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ir-llm"
version = "0.1.0"
description = "Experiments in sparse retrieval, synthetic queries, and retrieval-augmented generation"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "torch>=2.5,<3",
    "transformers>=4.51.3,<5",
    "pandas>=2.2,<3",
    "pyterrier[all]>=1,<2",
    "ir-datasets>=0.5,<1",
    "ir-measures>=0.3,<1",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
ir-llm-train = "IR_training_evaluation:main"
ir-llm-synthetic = "synthetic_data_gen:main"
ir-llm-rag = "rag_test:main"

[tool.setuptools]
packages = ["ir_llm"]
py-modules = ["IR_training_evaluation", "synthetic_data_gen", "rag_test", "utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
